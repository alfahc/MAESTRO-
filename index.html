<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alfa HC | Gestión Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --midnight: #121b2d; --gold: #f4b41a; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--midnight); color: white; margin: 0; }
        .view-section { display: none; min-height: 100vh; flex-direction: column; width: 100%; }
        .view-active { display: flex; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 10px; color: #334155; border: 1px solid #e2e8f0; }
        .btn-gold { background: var(--gold); color: black; padding: 15px; border-radius: 12px; font-weight: 800; width: 100%; border: none; }
        input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: 1px solid #cbd5e1; color: black; font-weight: 600; }
        .fixed-footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--midnight); padding: 15px; border-top: 1px solid #1e293b; z-index: 1000; }
        .search-results { position: absolute; background: white; width: 100%; z-index: 50; border-radius: 0 0 10px 10px; box-shadow: 0 10px 15px rgba(0,0,0,0.2); max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <nav class="p-4 border-b-2 border-gold flex justify-between items-center sticky top-0 bg-[#121b2d] z-[1100]">
        <div>
            <h1 class="text-lg font-black text-gold italic">ALFA HC</h1>
            <p class="text-[8px] text-slate-400 font-bold uppercase tracking-widest">RIF: J-411261297</p>
        </div>
        <button onclick="goBack()" id="back-btn" class="hidden bg-slate-800 text-[10px] px-3 py-2 rounded-lg font-bold">VOLVER</button>
    </nav>

    <section id="view-hero" class="view-section view-active items-center justify-center p-8 space-y-4">
        <button onclick="goTo('order')" class="btn-gold shadow-lg"><i class="fas fa-cart-plus mr-2"></i> NUEVO PEDIDO</button>
        <button onclick="goTo('debts')" class="w-full bg-white text-slate-800 p-4 rounded-xl font-black shadow-lg"><i class="fas fa-wallet text-blue-600 mr-2"></i> CARTERA DE DEUDORES</button>
        <button onclick="enviarUbicacion()" class="bg-gradient-to-r from-blue-500 to-green-500 text-white px-6 py-3 rounded-full font-bold text-xs uppercase tracking-widest"><i class="fas fa-map-marker-alt mr-2 text-red-500"></i> Compartir Ubicación</button>
    </section>

    <section id="view-order" class="view-section">
        <div class="p-4 pb-40 overflow-y-auto bg-slate-50 flex-1">
            <div id="product-list" class="space-y-2"></div>
            
            <div class="card mt-6">
                <h4 class="text-[10px] font-black text-slate-400 uppercase mb-2">Buscador / Datos Cliente</h4>
                <div class="relative">
                    <input id="inp-nom" type="text" placeholder="Nombre o Negocio" oninput="buscarCliente(this.value)">
                    <div id="results" class="search-results hidden"></div>
                </div>
                <input id="inp-rif" type="text" placeholder="RIF o Cédula">
                <input id="inp-dir" type="text" placeholder="Dirección del Local">
            </div>
        </div>

        <footer class="fixed-footer">
            <div class="flex justify-between items-center mb-3">
                <span class="text-slate-400 text-xs font-bold">MONTO PEDIDO:</span>
                <span id="total-val" class="text-gold text-2xl font-black">$0.00</span>
            </div>
            <button onclick="procesarVenta()" class="w-full bg-emerald-500 p-4 rounded-xl font-black flex items-center justify-center gap-2">
                <i class="fas fa-file-invoice-dollar"></i> GENERAR NOTA Y WHATSAPP
            </button>
        </footer>
    </section>

    <section id="view-debts" class="view-section bg-slate-50">
        <div id="debt-list" class="p-4 flex-1"></div>
        <div class="fixed-footer text-center">
            <p id="total-cartera" class="text-gold font-black text-lg"></p>
        </div>
    </section>

    <script>
        const prods = [
            { n: 'BELMONT', p: 25.60 }, { n: 'BELMONT MEDIA CAJA', p: 15.40 },
            { n: 'LUCKY NOVA', p: 30.60 }, { n: 'LUCKY RED', p: 28.00 },
            { n: 'PALL MALL', p: 25.60 }, { n: 'VICEROY', p: 16.50 },
            { n: 'CONSUL', p: 14.00 }, { n: 'LUCKY COSMIC', p: 30.60 },
            { n: 'ENCENDEDOR BIC', p: 1.50 }
        ];
        let cart = {};

        // NAVEGACIÓN
        function goTo(v) { window.history.pushState({v}, ""); show(v); }
        function goBack() { window.history.back(); }
        window.onpopstate = (e) => show(e.state?.v || 'hero');
        function show(v) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('view-active'));
            document.getElementById('view-'+v).classList.add('view-active');
            document.getElementById('back-btn').classList.toggle('hidden', v === 'hero');
            if(v === 'order') renderProds();
            if(v === 'debts') renderDebts();
        }

        // LÓGICA PEDIDO
        function renderProds() {
            document.getElementById('product-list').innerHTML = prods.map(p => `
                <div class="card flex justify-between items-center py-2">
                    <div><b class="text-xs uppercase">${p.n}</b><br><small class="text-slate-400">$${p.p.toFixed(2)}</small></div>
                    <div class="flex items-center gap-3">
                        <button onclick="upd('${p.n}',-1)" class="w-8 h-8 bg-slate-100 rounded-lg font-bold">-</button>
                        <b class="w-4 text-center text-sm">${cart[p.n] || 0}</b>
                        <button onclick="upd('${p.n}',1)" class="w-8 h-8 bg-slate-800 text-white rounded-lg font-bold">+</button>
                    </div>
                </div>`).join('');
            calc();
        }
        function upd(n, c) { cart[n] = Math.max(0, (cart[n] || 0) + c); renderProds(); }
        function calc() {
            let t = 0;
            prods.forEach(p => t += (cart[p.n] || 0) * p.p);
            document.getElementById('total-val').innerText = `$${t.toFixed(2)}`;
            return t;
        }

        // MEMORIA DE CLIENTES
        function buscarCliente(val) {
            const db = JSON.parse(localStorage.getItem('alfa_db')) || {};
            const res = document.getElementById('results');
            const matches = Object.keys(db).filter(k => k.toLowerCase().includes(val.toLowerCase()));
            
            if(val && matches.length) {
                res.innerHTML = matches.map(m => `<div onclick="setCli('${m}')" class="p-3 border-b text-sm text-slate-700 font-bold bg-white">${m}</div>`).join('');
                res.classList.remove('hidden');
            } else res.classList.add('hidden');
        }

        function setCli(m) {
            const db = JSON.parse(localStorage.getItem('alfa_db'));
            document.getElementById('inp-nom').value = m;
            document.getElementById('inp-rif').value = db[m].rif;
            document.getElementById('inp-dir').value = db[m].dir;
            document.getElementById('results').classList.add('hidden');
        }

        // PROCESAR VENTA Y LIMPIAR
        function procesarVenta() {
            const nom = document.getElementById('inp-nom').value.trim().toUpperCase();
            const total = calc();
            if(!nom || total <= 0) return alert("Faltan datos o productos");

            let db = JSON.parse(localStorage.getItem('alfa_db')) || {};
            if(!db[nom]) db[nom] = { rif: document.getElementById('inp-rif').value, dir: document.getElementById('inp-dir').value, deuda: 0 };
            db[nom].deuda += total;
            localStorage.setItem('alfa_db', JSON.stringify(db));

            // PDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("ALFA HC - NOTA DE ENTREGA", 15, 20);
            const rows = [];
            prods.forEach(p => { if(cart[p.n]) rows.push([p.n, cart[p.n], `$${(cart[p.n]*p.p).toFixed(2)}`]); });
            doc.autoTable({ startY: 30, head: [['Producto', 'Cant', 'Total']], body: rows });
            doc.save(`Nota_${nom}.pdf`);

            // WhatsApp
            window.location.href = `https://wa.me/584124401702?text=${encodeURIComponent(`*ALFA HC - NUEVO PEDIDO*\nCliente: ${nom}\nTotal: $${total.toFixed(2)}`)}`;

            // --- AQUÍ ESTÁ LA LIMPIEZA ---
            cart = {}; // Vaciar carrito
            document.getElementById('inp-nom').value = "";
            document.getElementById('inp-rif').value = "";
            document.getElementById('inp-dir').value = "";
            renderProds(); // Resetear vista
        }

        // COBRANZAS
        function renderDebts() {
            const db = JSON.parse(localStorage.getItem('alfa_db')) || {};
            let tG = 0;
            const html = Object.keys(db).map(k => {
                if(db[k].deuda <= 0) return '';
                tG += db[k].deuda;
                return `<div class="card flex justify-between items-center">
                    <div><b>${k}</b><br><small class="text-red-500 font-bold">$${db[k].deuda.toFixed(2)}</small></div>
                    <button onclick="abonar('${k}')" class="bg-emerald-500 text-white text-[10px] px-4 py-2 rounded-lg font-black">REGISTRAR PAGO</button>
                </div>`;
            }).join('');
            document.getElementById('debt-list').innerHTML = html || '<p class="text-center text-slate-400 py-20 font-bold">Sin deudas pendientes</p>';
            document.getElementById('total-cartera').innerText = `TOTAL POR COBRAR: $${tG.toFixed(2)}`;
        }

        function abonar(k) {
            const a = parseFloat(prompt(`Monto a pagar por ${k}:`));
            if(!a || a <= 0) return;
            let db = JSON.parse(localStorage.getItem('alfa_db'));
            db[k].deuda = Math.max(0, db[k].deuda - a);
            localStorage.setItem('alfa_db', JSON.stringify(db));
            renderDebts();
        }

        function enviarUbicacion() {
            navigator.geolocation.getCurrentPosition(p => {
                const link = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                window.location.href = `https://wa.me/584124401702?text=${encodeURIComponent('📍 UBICACIÓN DE ENTREGA: ' + link)}`;
            }, () => alert("GPS Desactivado"));
        }
    </script>
</body>
</html>
