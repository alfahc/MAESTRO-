<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alfa HC | Catálogo Maestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --midnight: #121b2d; --gold: #f4b41a; --whatsapp: #25D366; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--midnight);
            height: 100dvh; width: 100vw; overflow: hidden;
            color: white; margin: 0;
        }

        /* Pantallas */
        .view-section {
            position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
            display: none; flex-direction: column; background: var(--midnight);
            z-index: 10;
        }
        .view-active { display: flex !important; }

        .hero-gradient { 
            background: radial-gradient(circle at center, #1e293b 0%, var(--midnight) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: space-around;
            padding: 40px 20px; text-align: center;
        }

        .sticky-nav {
            height: 60px; background: var(--midnight); border-bottom: 2px solid var(--gold);
            padding: 0 20px; display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; width: 100%; z-index: 100;
        }

        .static-container {
            flex: 1; background: #f8fafc; padding: 12px; overflow-y: auto; color: #334155;
        }

        .product-card {
            background: white; display: flex; align-items: center; justify-content: space-between;
            padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #e2e8f0;
        }

        .qty-btn {
            background: #f1f5f9; width: 35px; height: 35px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-weight: 800;
        }

        .btn-location-maps {
            background: linear-gradient(135deg, #4285F4 0%, #34A853 100%);
            color: white; padding: 14px 24px; border-radius: 50px; font-weight: 800;
            display: inline-flex; align-items: center; gap: 10px; font-size: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .catalog-footer {
            background: var(--midnight); padding: 15px 20px env(safe-area-inset-bottom);
            border-top: 1px solid #1e293b;
        }

        .input-data {
            width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px;
            border: 1px solid #cbd5e1; font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="sticky-nav">
        <div>
            <h1 class="text-lg font-black italic text-gold leading-none">ALFA HC</h1>
            <p class="text-[7px] uppercase tracking-widest text-slate-400">Distribuidora</p>
        </div>
        <button onclick="goHome()" id="back-btn" class="hidden bg-slate-800 text-white text-[10px] px-4 py-2 rounded-lg font-bold border border-slate-600">VOLVER</button>
    </nav>

    <section id="view-hero" class="view-section view-active hero-gradient">
        <div class="border border-gold/30 bg-gold/10 px-4 py-1 rounded-full text-[10px] font-bold text-gold uppercase tracking-tighter">Catálogo Oficial 2026</div>
        
        <h2 class="text-2xl font-black leading-tight">Cigarrillos Nacionales<br><span class="text-gold">MARCA BIGOTT</span></h2>

        <div class="flex flex-col items-center gap-4">
            <button onclick="enviarUbicacion()" class="btn-location-maps">
                <i class="fas fa-map-marker-alt"></i> <span id="txt-loc">ENVIAR MI UBICACIÓN</span>
            </button>
            
            <button onclick="goToOrder()" class="bg-gold text-black w-64 py-4 rounded-2xl font-black shadow-xl active:scale-95 transition-all">
                VER LISTA DE PRECIOS <i class="fas fa-chevron-right ml-2"></i>
            </button>
        </div>
        
        <p class="text-slate-500 text-[9px] font-bold tracking-[0.4em] uppercase">Calidad y Servicio</p>
    </section>

    <section id="view-order" class="view-section">
        <div class="static-container">
            <div id="order-list"></div>
            
            <div class="mt-4 p-4 bg-white rounded-xl shadow-sm border border-gold/20 mb-10">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Datos del Cliente</p>
                <select id="select-historial" onchange="autocompletarCliente()" class="input-data bg-slate-50 mb-4 text-xs">
                    <option value="">-- Buscar cliente guardado --</option>
                </select>
                <input id="inp-cliente" type="text" placeholder="Nombre del Negocio" class="input-data text-sm">
                <input id="inp-rif" type="text" placeholder="RIF / Cédula" class="input-data text-sm">
                <input id="inp-direccion" type="text" placeholder="Dirección de entrega" class="input-data text-sm">
            </div>
        </div>
        
        <footer class="catalog-footer">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-bold text-slate-400">TOTAL:</span>
                <span id="grand-total" class="text-2xl font-black text-gold">$0.00</span>
            </div>
            <button onclick="sendWhatsAppOrder()" class="w-full bg-[#25D366] py-4 rounded-xl font-black flex items-center justify-center gap-2 shadow-lg">
                <i class="fab fa-whatsapp text-xl"></i> ENVIAR PEDIDO
            </button>
        </footer>
    </section>

    <script>
        const products = [
            { name: 'BELMONT', price: 25.60 },
            { name: 'BELMONT MEDIA CAJA', price: 15.40 },
            { name: 'LUCKY NOVA', price: 30.60 },
            { name: 'LUCKY RED ORIGINAL', price: 28.00 },
            { name: 'PALL MALL', price: 25.60 },
            { name: 'VICEROY', price: 16.50 },
            { name: 'CONSUL', price: 14.00 },
            { name: 'LUCKY COSMIC', price: 30.60 },
            { name: 'ENCENDEDOR BIC', price: 1.50 }
        ];

        let cart = {};

        // --- NAVEGACIÓN REAL ---
        function goToOrder() {
            document.getElementById('view-hero').classList.remove('view-active');
            document.getElementById('view-order').classList.add('view-active');
            document.getElementById('back-btn').classList.remove('hidden');
            window.history.pushState({page: 2}, "");
            renderOrderList();
            cargarListaClientes();
        }

        function goHome() {
            document.getElementById('view-hero').classList.add('view-active');
            document.getElementById('view-order').classList.remove('view-active');
            document.getElementById('back-btn').classList.add('hidden');
        }

        window.onpopstate = function() { goHome(); };

        // --- FUNCIONES ---
        function renderOrderList() {
            const container = document.getElementById('order-list');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div>
                        <p class="text-xs font-black text-slate-800">${p.name}</p>
                        <p class="text-[10px] font-bold text-slate-400">$${p.price.toFixed(2)}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="updateQty('${p.name}', -1)" class="qty-btn text-slate-400">-</button>
                        <span class="font-black text-slate-800">${cart[p.name] || 0}</span>
                        <button onclick="updateQty('${p.name}', 1)" class="qty-btn text-gold">+</button>
                    </div>
                </div>
            `).join('');
            calculateTotal();
        }

        function updateQty(name, change) {
            cart[name] = Math.max(0, (cart[name] || 0) + change);
            renderOrderList();
        }

        function calculateTotal() {
            let total = 0;
            products.forEach(p => { if(cart[p.name]) total += p.price * cart[p.name]; });
            document.getElementById('grand-total').innerText = `$${total.toFixed(2)}`;
            return total;
        }

        function cargarListaClientes() {
            const db = JSON.parse(localStorage.getItem('alfa_clientes')) || {};
            const select = document.getElementById('select-historial');
            select.innerHTML = '<option value="">-- Buscar cliente guardado --</option>';
            Object.keys(db).forEach(n => {
                const opt = document.createElement('option');
                opt.value = n; opt.textContent = n;
                select.appendChild(opt);
            });
        }

        function autocompletarCliente() {
            const n = document.getElementById('select-historial').value;
            if(!n) return;
            const db = JSON.parse(localStorage.getItem('alfa_clientes')) || {};
            document.getElementById('inp-cliente').value = n;
            document.getElementById('inp-rif').value = db[n].rif;
            document.getElementById('inp-direccion').value = db[n].dir;
        }

        function sendWhatsAppOrder() {
            const nom = document.getElementById('inp-cliente').value;
            const rif = document.getElementById('inp-rif').value;
            const dir = document.getElementById('inp-direccion').value;
            let items = "";
            products.forEach(p => { if(cart[p.name] > 0) items += `• ${cart[p.name]}x ${p.name}\n`; });

            if(!items || !nom) return alert("Faltan datos o productos");

            let db = JSON.parse(localStorage.getItem('alfa_clientes')) || {};
            db[nom.toUpperCase()] = { rif, dir };
            localStorage.setItem('alfa_clientes', JSON.stringify(db));

            const msg = `*ALFA HC - PEDIDO*\n\n*CLIENTE:* ${nom}\n*RIF:* ${rif}\n*DIR:* ${dir}\n\n*PRODUCTOS:*\n${items}\n💰 *TOTAL: ${document.getElementById('grand-total').innerText}*`;
            window.location.href = `https://wa.me/584124401702?text=${encodeURIComponent(msg)}`;
            
            // Limpiar todo después de enviar
            cart = {};
            document.getElementById('inp-cliente').value = "";
            document.getElementById('inp-rif').value = "";
            document.getElementById('inp-direccion').value = "";
            renderOrderList();
        }

        function enviarUbicacion() {
            const txt = document.getElementById('txt-loc');
            txt.innerText = "LOCALIZANDO...";
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                // ESTE ES EL ENLACE CORRECTO
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                const msg = `📍 *UBICACIÓN DE ENTREGA:* \n${mapLink}`;
                window.location.href = `https://wa.me/584124401702?text=${encodeURIComponent(msg)}`;
                setTimeout(() => { txt.innerText = "ENVIAR MI UBICACIÓN"; }, 2000);
            }, () => { alert("Active el GPS"); txt.innerText = "ENVIAR MI UBICACIÓN"; });
        }

        window.onload = () => { goHome(); };
    </script>
</body>
</html>
