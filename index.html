<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alfa HC | Sistema de Gestión Maestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root { --midnight: #121b2d; --gold: #f4b41a; --whatsapp: #25D366; }
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: pan-y; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--midnight); height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; color: white; }
        .hero-gradient { background: radial-gradient(circle at center, #1e293b 0%, var(--midnight) 100%); }
        .sticky-nav { background: var(--midnight); border-bottom: 2px solid var(--gold); padding: 10px 20px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .view-section { display: none; flex: 1; height: 100%; overflow: hidden; }
        .view-active { display: flex; flex-direction: column; }
        .static-container { flex: 1; display: flex; flex-direction: column; background: #f8fafc; padding: 8px 12px; overflow-y: auto; color: #334155; }
        .product-card { background: white; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 6px; }
        .qty-btn { background: #f1f5f9; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid #e2e8f0; }
        .catalog-footer { background: var(--midnight); padding: 12px 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); flex-shrink: 0; border-top: 1px solid #1e293b; }
        .btn-action { background-color: var(--whatsapp); color: white; padding: 14px; border-radius: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
        .input-data { width: 100%; padding: 10px; margin-top: 8px; border-radius: 10px; border: 1px solid #cbd5e1; color: #1e293b; font-size: 12px; font-weight: 600; }
        .debt-card { background: white; padding: 15px; border-radius: 15px; border-left: 5px solid var(--gold); margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <nav class="sticky-nav">
        <div class="flex flex-col">
            <h1 class="text-lg font-black italic text-gold uppercase tracking-tighter">ALFA HC</h1>
            <p class="text-[6px] text-slate-400 font-bold uppercase tracking-widest">Gestión de Cobranzas</p>
        </div>
        <button onclick="goBack()" id="back-btn" class="hidden text-white text-[9px] font-bold uppercase border border-slate-700 px-3 py-1.5 rounded-lg bg-slate-800">Volver</button>
    </nav>

    <section id="view-hero" class="view-section view-active hero-gradient text-center px-10 py-12 justify-between">
        <div class="mt-4"><span class="border border-gold/40 bg-gold/10 rounded-full px-5 py-1.5 text-[9px] font-bold text-gold uppercase">Panel de Control</span></div>
        <div class="w-full flex flex-col gap-4">
            <button onclick="goToView('order')" class="bg-gold text-black py-4 rounded-2xl font-black text-sm shadow-xl flex items-center justify-center gap-3">
                <i class="fas fa-plus-circle"></i> NUEVO PEDIDO / NOTA
            </button>
            <button onclick="goToView('debts')" class="bg-white text-slate-800 py-4 rounded-2xl font-black text-sm shadow-xl flex items-center justify-center gap-3">
                <i class="fas fa-wallet text-blue-600"></i> CUENTAS POR COBRAR
            </button>
            <button onclick="enviarUbicacion()" class="text-white text-[10px] font-bold uppercase opacity-60">
                <i class="fas fa-map-marker-alt"></i> Compartir mi Ubicación
            </button>
        </div>
        <p class="text-slate-500 text-[8px] font-bold uppercase tracking-[0.3em]">Calidad • Puntualidad • Servicio</p>
    </section>

    <section id="view-order" class="view-section">
        <div class="static-container">
            <div id="order-list"></div>
            <div class="mt-4 p-4 bg-white rounded-xl border border-gold/30 shadow-sm mb-6">
                <h4 class="text-[10px] font-black text-slate-400 uppercase mb-2">Buscador Predictivo</h4>
                <input id="search-input" type="text" placeholder="Escriba nombre del cliente..." class="input-data bg-gold/5" oninput="filtrarClientes()">
                <div id="search-results" class="hidden bg-white border border-slate-200 rounded-lg mt-1 max-h-40 overflow-y-auto"></div>
                <hr class="my-4">
                <input id="inp-cliente" type="text" placeholder="Nombre/Negocio" class="input-data">
                <input id="inp-rif" type="text" placeholder="RIF/Cédula" class="input-data">
                <input id="inp-direccion" type="text" placeholder="Dirección" class="input-data">
            </div>
        </div>
        <footer class="catalog-footer">
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-white/60 text-[10px] font-bold uppercase">TOTAL:</span>
                <span id="grand-total" class="text-gold text-2xl font-black">$0.00</span>
            </div>
            <button onclick="procesarVenta()" class="btn-action">
                <i class="fas fa-file-invoice-dollar"></i> GENERAR NOTA Y WHATSAPP
            </button>
        </footer>
    </section>

    <section id="view-debts" class="view-section">
        <div class="bg-blue-50 px-5 py-3 border-b flex justify-between items-center">
            <h3 class="text-[10px] font-black text-blue-800 uppercase">Clientes con Deuda</h3>
            <span id="total-cartera" class="text-xs font-black text-blue-600"></span>
        </div>
        <div class="static-container" id="debt-list">
            </div>
    </section>

    <script>
        const products = [
            { name: 'BELMONT', price: 25.60 }, { name: 'BELMONT MEDIA CAJA', price: 15.40 },
            { name: 'LUCKY NOVA', price: 30.60 }, { name: 'LUCKY RED ORIGINAL', price: 28.00 },
            { name: 'PALL MALL', price: 25.60 }, { name: 'VICEROY', price: 16.50 },
            { name: 'CONSUL', price: 14.00 }, { name: 'LUCKY COSMIC', price: 30.60 },
            { name: 'ENCENDEDOR BIC', price: 1.50 }
        ];
        let cart = {};

        function goToView(view) {
            window.history.pushState({view: view}, "");
            renderView(view);
        }

        function goBack() { window.history.back(); }
        window.onpopstate = function(e) { renderView(e.state?.view || 'hero'); };

        function renderView(view) {
            ['view-hero', 'view-order', 'view-debts'].forEach(v => document.getElementById(v).style.display = 'none');
            document.getElementById('view-' + view).style.display = 'flex';
            document.getElementById('back-btn').classList.toggle('hidden', view === 'hero');
            if(view === 'order') renderOrderList();
            if(view === 'debts') renderDebtList();
        }

        function renderOrderList() {
            const container = document.getElementById('order-list');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="flex flex-col"><span class="text-[10px] font-bold text-slate-700">${p.name}</span><span class="text-[9px] text-slate-400">$${p.price.toFixed(2)}</span></div>
                    <div class="flex items-center gap-3"><button onclick="updateQty('${p.name}', -1)" class="qty-btn">-</button><span class="w-6 text-center font-bold text-slate-800">${cart[p.name] || 0}</span><button onclick="updateQty('${p.name}', 1)" class="qty-btn">+</button></div>
                </div>`).join('');
            calculateTotal();
        }

        function updateQty(name, change) { cart[name] = Math.max(0, (cart[name] || 0) + change); renderOrderList(); }
        function calculateTotal() {
            let total = 0;
            products.forEach(p => { if (cart[p.name]) total += p.price * cart[p.name]; });
            document.getElementById('grand-total').innerText = `$${total.toFixed(2)}`;
            return total;
        }

        // --- GESTIÓN DE DEUDAS ---
        function renderDebtList() {
            const list = document.getElementById('debt-list');
            const db = JSON.parse(localStorage.getItem('alfa_clientes')) || {};
            let totalCartera = 0;
            
            list.innerHTML = Object.keys(db).map(nom => {
                const c = db[nom];
                if((c.deuda || 0) <= 0) return '';
                totalCartera += c.deuda;
                return `
                <div class="debt-card">
                    <div class="flex justify-between items-start mb-2">
                        <div><h4 class="font-black text-sm uppercase">${nom}</h4><p class="text-[9px] text-slate-400">RIF: ${c.rif}</p></div>
                        <div class="text-right"><p class="text-[10px] font-bold text-slate-400 uppercase">Saldo Pendiente</p><p class="text-lg font-black text-red-600">$${c.deuda.toFixed(2)}</p></div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="registrarAbono('${nom}')" class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-4 py-2 rounded-lg flex-1">REGISTRAR ABONO</button>
                        <button onclick="descargarEstado('${nom}')" class="bg-slate-100 text-slate-600 text-[10px] font-bold px-4 py-2 rounded-lg"><i class="fas fa-print"></i></button>
                    </div>
                </div>`;
            }).join('') || '<p class="text-center text-slate-400 mt-10 font-bold uppercase text-[10px]">No hay deudas pendientes</p>';
            
            document.getElementById('total-cartera').innerText = `TOTAL POR COBRAR: $${totalCartera.toFixed(2)}`;
        }

        function registrarAbono(nombre) {
            const monto = parseFloat(prompt(`Registrar abono para ${nombre}:\nSaldo actual: $${JSON.parse(localStorage.getItem('alfa_clientes'))[nombre].deuda.toFixed(2)}`));
            if(!monto || monto <= 0) return;
            
            let db = JSON.parse(localStorage.getItem('alfa_clientes'));
            db[nombre].deuda -= monto;
            localStorage.setItem('alfa_clientes', JSON.stringify(db));
            alert("Abono registrado con éxito.");
            renderDebtList();
        }

        function procesarVenta() {
            const nom = document.getElementById('inp-cliente').value.trim().toUpperCase();
            const total = calculateTotal();
            if (!nom || total === 0) return alert("Datos incompletos");

            let db = JSON.parse(localStorage.getItem('alfa_clientes')) || {};
            if(!db[nom]) db[nom] = { rif: document.getElementById('inp-rif').value, dir: document.getElementById('inp-direccion').value, deuda: 0 };
            
            db[nom].deuda = (db[nom].deuda || 0) + total; // Sumar a la deuda actual
            localStorage.setItem('alfa_clientes', JSON.stringify(db));

            generarPDF(nom, total); // Función de nota de entrega
            alert("Venta registrada. Saldo actualizado.");
            cart = {}; renderOrderList(); goToView('debts');
        }

        function generarPDF(nom, total) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(20); doc.text("ALFA HC - NOTA DE ENTREGA", 15, 20);
            doc.setFontSize(10); doc.text(`CLIENTE: ${nom} | FECHA: ${new Date().toLocaleDateString()}`, 15, 30);
            const rows = [];
            products.forEach(p => { if(cart[p.name]) rows.push([p.name, cart[p.name], `$${p.price.toFixed(2)}`, `$${(p.price * cart[p.name]).toFixed(2)}`]); });
            doc.autoTable({ startY: 40, head: [['Producto', 'Cant', 'Precio', 'Subtotal']], body: rows });
            doc.text(`TOTAL A PAGAR: $${total.toFixed(2)}`, 140, doc.lastAutoTable.finalY + 10);
            doc.save(`Nota_${nom}.pdf`);
        }

        // --- REUTILIZACIÓN DE FUNCIONES PREVIAS ---
        function filtrarClientes() {
            const input = document.getElementById('search-input').value.toUpperCase();
            const res = document.getElementById('search-results');
            const db = JSON.parse(localStorage.getItem('alfa_clientes')) || {};
            const matches = Object.keys(db).filter(n => n.includes(input));
            res.innerHTML = matches.map(n => `<div onclick="setCli('${n}')" class="p-3 border-b text-xs font-bold text-slate-700">${n}</div>`).join('');
            res.classList.toggle('hidden', matches.length === 0 || input === '');
        }
        function setCli(n) {
            const db = JSON.parse(localStorage.getItem('alfa_clientes'));
            document.getElementById('inp-cliente').value = n;
            document.getElementById('inp-rif').value = db[n].rif;
            document.getElementById('inp-direccion').value = db[n].dir;
            document.getElementById('search-results').classList.add('hidden');
        }
        function enviarUbicacion() {
            navigator.geolocation.getCurrentPosition(p => {
                window.location.href = `https://wa.me/584124401702?text=📍 Ubicación: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
            });
        }
    </script>
</body>
</html>
