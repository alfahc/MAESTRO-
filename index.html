<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfa HC - Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-card img { height: 120px; object-fit: cover; width: 100%; border-radius: 8px; }
    </style>
</head>
<body class="bg-gray-100 pb-10">

    <div class="max-w-md mx-auto p-4">
        <header class="text-center py-4">
            <h1 class="text-3xl font-extrabold text-blue-900 italic">ALFA HC</h1>
            <p class="text-gray-600 text-sm">Distribuidora de Alimentos</p>
        </header>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white p-2 rounded-lg shadow text-center">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_fE4Q6x0mC6Z-zZ9H8uK_GvYmI6KzG8f7Xg&s" alt="Harina">
                <h3 class="text-sm font-bold mt-1">Harina Pan</h3>
                <p class="text-blue-600 font-bold">$1.15</p>
                <button onclick="agregar('Harina Pan', 1.15)" class="bg-blue-600 text-white text-xs px-3 py-1 rounded-full mt-1">+ Añadir</button>
            </div>
            <div class="bg-white p-2 rounded-lg shadow text-center">
                <img src="https://http2.mlstatic.com/D_NQ_NP_603816-MLV43354385223_092020-O.jpg" alt="Aceite">
                <h3 class="text-sm font-bold mt-1">Aceite 1L</h3>
                <p class="text-blue-600 font-bold">$2.40</p>
                <button onclick="agregar('Aceite 1L', 2.40)" class="bg-blue-600 text-white text-xs px-3 py-1 rounded-full mt-1">+ Añadir</button>
            </div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-xl">
            <h2 class="font-bold border-b mb-3">TU PEDIDO</h2>
            <div id="carrito" class="text-sm mb-3 space-y-1">
                <p class="text-gray-400">No hay productos...</p>
            </div>
            <div class="text-right font-bold text-lg mb-5 text-blue-800">Total: $<span id="total">0.00</span></div>

            <h2 class="font-bold border-b mb-3 text-xs uppercase text-gray-500">Datos de Entrega</h2>
            <div class="space-y-2">
                <input id="cliente" type="text" placeholder="Tu Nombre" class="w-full p-2 border rounded-md text-sm">
                <input id="rif" type="text" placeholder="Cédula / RIF" class="w-full p-2 border rounded-md text-sm">
                <input id="direccion" type="text" placeholder="Dirección Exacta" class="w-full p-2 border rounded-md text-sm">
            </div>

            <button onclick="enviar()" id="btn" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl mt-6 shadow-lg hover:bg-green-700 transition">
                CONFIRMAR PEDIDO ✅
            </button>
        </div>
    </div>

    <script>
        // TU URL DE GOOGLE (YA LA PUSE POR TI)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymaqrxlIUCOdz51HPIkpjLRa-y3l8pViPEDsA0fWB7qVKI3OQQ1WcQA-u5vg972sI/exec";
        
        let items = [];
        let suma = 0;

        function agregar(p, pr) {
            items.push(p);
            suma += pr;
            document.getElementById('carrito').innerHTML = items.map(i => `<div>• ${i}</div>`).join('');
            document.getElementById('total').innerText = suma.toFixed(2);
        }

        async function enviar() {
            const nom = document.getElementById('cliente').value;
            const rif = document.getElementById('rif').value;
            const dir = document.getElementById('direccion').value;

            if(!nom || items.length === 0) return alert("Llena tu nombre y elige productos");

            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.innerText = "Registrando...";

            const pedidoTxt = items.join(", ");

            try {
                // 1. Guardar en tu Google Sheets automáticamente
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        cliente: nom,
                        rif: rif,
                        direccion: dir,
                        pedido: pedidoTxt,
                        total: suma
                    })
                });

                // 2. Crear mensaje para WhatsApp con UBICACIÓN
                const mensaje = `*ALFA HC - NUEVO PEDIDO*%0A---------------------------%0A*Cliente:* ${nom}%0A*RIF:* ${rif}%0A*Pedido:* ${pedidoTxt}%0A*Total:* $${suma.toFixed(2)}%0A*Dirección:* ${dir}%0A---------------------------%0A_Por favor, confirma el pedido._`;
                
                // CAMBIA ESTE NÚMERO POR EL TUYO:
                const miTelefono = "584120000000"; 
                
                window.location.href = `https://wa.me/${miTelefono}?text=${mensaje}`;

            } catch (e) {
                alert("Error de conexión");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
