<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alfa HC | Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root { --midnight: #121b2d; --gold: #f4b41a; --whatsapp: #25D366; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--midnight); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; color: white; }
        .sticky-nav { background: var(--midnight); border-bottom: 2px solid var(--gold); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .view-section { display: none; flex: 1; height: 100%; overflow: hidden; }
        .view-active { display: flex; flex-direction: column; }
        .static-container { flex: 1; background: #f8fafc; padding: 12px; overflow-y: auto; }
        .product-card { background: white; display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 8px; color: #334155; }
        .qty-btn { background: #f1f5f9; width: 35px; height: 35px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid #e2e8f0; }
        .catalog-footer { background: var(--midnight); padding: 15px 20px; border-top: 1px solid #1e293b; }
        .btn-whatsapp { background-color: var(--whatsapp); color: white; padding: 16px; border-radius: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
        .btn-loc { background: rgba(59,130,246,0.1); color: #60a5fa; padding: 12px 20px; border-radius: 50px; font-size: 11px; border: 1px solid rgba(59,130,246,0.3); margin-bottom: 10px; }
    </style>
</head>
<body>

    <nav class="sticky-nav">
        <div>
            <h1 class="text-lg font-black italic text-gold">ALFA HC</h1>
            <p class="text-[7px] uppercase tracking-widest text-slate-400">Distribuidora Oficial</p>
        </div>
        <button onclick="toggleView('hero')" id="back-btn" class="hidden text-white text-[10px] font-bold uppercase border border-slate-700 px-4 py-2 rounded-lg">Volver</button>
    </nav>

    <section id="view-hero" class="view-section view-active items-center justify-center px-10 text-center">
        <h2 class="text-2xl font-extrabold mb-6">BIENVENIDO A<br><span class="text-gold">NUESTRO CATÁLOGO</span></h2>
        
        <button onclick="enviarUbicacion()" class="btn-loc">
            <i class="fas fa-map-marker-alt"></i> <span id="txt-loc">Enviar Ubicación Actual</span>
        </button>
        <p class="text-[9px] text-slate-500 mb-10 italic">* Active su GPS antes de presionar</p>

        <button onclick="toggleView('order')" class="bg-gold text-black px-8 py-4 rounded-2xl font-black w-full shadow-xl">
            VER LISTA DE PRECIOS <i class="fas fa-chevron-right ml-2"></i>
        </button>
    </section>

    <section id="view-order" class="view-section">
        <div class="static-container" id="order-list"></div>
        <footer class="catalog-footer">
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-white/60 text-[11px] font-bold">TOTAL PEDIDO:</span>
                <span id="grand-total" class="text-gold text-2xl font-black">$0.00</span>
            </div>
            <button onclick="sendWhatsAppOrder()" class="btn-whatsapp">
                <i class="fab fa-whatsapp text-2xl"></i> ENVIAR POR WHATSAPP
            </button>
        </footer>
    </section>

    <script>
        const products = [
            { name: 'BELMONT', price: 25.60 },
            { name: 'BELMONT MEDIA CAJA', price: 15.40 },
            { name: 'LUCKY NOVA', price: 30.60 },
            { name: 'LUCKY RED ORIGINAL', price: 28.00 },
            { name: 'PALL MALL', price: 25.60 },
            { name: 'VICEROY', price: 16.50 },
            { name: 'CONSUL', price: 14.00 },
            { name: 'LUCKY COSMIC', price: 30.60 },
            { name: 'ENCENDEDOR BIC', price: 1.50 }
        ];

        let cart = {};

        function toggleView(view) {
            document.getElementById('view-hero').classList.toggle('view-active', view === 'hero');
            document.getElementById('view-order').classList.toggle('view-active', view === 'order');
            document.getElementById('back-btn').classList.toggle('hidden', view === 'hero');
            if(view === 'order') renderOrderList();
        }

        function renderOrderList() {
            const container = document.getElementById('order-list');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="flex flex-col">
                        <span class="font-bold text-sm">${p.name}</span>
                        <span class="text-xs text-slate-400">$${p.price.toFixed(2)}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="updateQty('${p.name}', -1)" class="qty-btn">-</button>
                        <span class="font-bold w-4 text-center">${cart[p.name] || 0}</span>
                        <button onclick="updateQty('${p.name}', 1)" class="qty-btn">+</button>
                    </div>
                </div>
            `).join('');
            calculateTotal();
        }

        function updateQty(name, change) {
            cart[name] = Math.max(0, (cart[name] || 0) + change);
            renderOrderList();
        }

        function calculateTotal() {
            let total = 0;
            products.forEach(p => { if (cart[p.name]) total += p.price * cart[p.name]; });
            document.getElementById('grand-total').innerText = `$${total.toFixed(2)}`;
        }

        function sendWhatsAppOrder() {
            let message = "📦 *NUEVO PEDIDO - ALFA HC*\n\n";
            let hasItems = false;
            let total = 0;

            products.forEach(p => {
                if (cart[p.name] > 0) {
                    let sub = p.price * cart[p.name];
                    message += `▪️ ${cart[p.name]}x ${p.name} ($${sub.toFixed(2)})\n`;
                    total += sub;
                    hasItems = true;
                }
            });

            if (!hasItems) return alert("Por favor, agrega productos al pedido.");
            
            message += `\n💰 *TOTAL: $${total.toFixed(2)}*`;
            
            // 1. Abrir WhatsApp
            window.open(`https://wa.me/584124401702?text=${encodeURIComponent(message)}`, '_blank');

            // 2. REINICIO TOTAL (Aquí está la clave)
            cart = {}; // Vacía la variable
            renderOrderList(); // Redibuja la lista con ceros
            calculateTotal(); // Pone el total en $0.00
            alert("Pedido enviado. El carrito se ha limpiado.");
        }

        function enviarUbicacion() {
            const btnText = document.getElementById('txt-loc');
            btnText.innerText = "BUSCANDO GPS...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    const msg = encodeURIComponent(`📍 *UBICACIÓN DE ENTREGA:* \n${mapLink}`);
                    window.location.href = `https://wa.me/584124401702?text=${msg}`;
                    btnText.innerText = "Enviar Ubicación Actual";
                },
                () => {
                    alert("Por favor, activa el GPS de tu teléfono.");
                    btnText.innerText = "Enviar Ubicación Actual";
                },
                { enableHighAccuracy: true }
            );
        }
    </script>
</body>
</html>
