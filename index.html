<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alfa HC | Gestión Maestra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root { --midnight: #121b2d; --gold: #f4b41a; --whatsapp: #25D366; }
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: pan-y; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--midnight); height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; color: white; }
        .hero-gradient { background: radial-gradient(circle at center, #1e293b 0%, var(--midnight) 100%); }
        .sticky-nav { background: var(--midnight); border-bottom: 2px solid var(--gold); padding: 10px 20px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .view-section { display: none; flex: 1; height: 100%; overflow: hidden; }
        .view-active { display: flex; flex-direction: column; }
        .static-container { flex: 1; display: flex; flex-direction: column; background: #f8fafc; padding: 8px 12px; overflow-y: auto; }
        .product-card { background: white; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 6px; color: #334155; }
        .qty-btn { background: #f1f5f9; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid #e2e8f0; }
        .catalog-footer { background: var(--midnight); padding: 12px 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); flex-shrink: 0; border-top: 1px solid #1e293b; }
        .btn-whatsapp-direct { background-color: var(--whatsapp); color: white; padding: 14px; border-radius: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .input-data { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: 1px solid #cbd5e1; color: #1e293b; font-size: 13px; font-weight: 600; background: white; }
        .btn-save-client { background: #3b82f6; color: white; padding: 8px; border-radius: 8px; font-size: 10px; font-weight: 800; width: 100%; margin-top: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav class="sticky-nav">
        <div class="flex flex-col">
            <h1 class="text-lg font-black italic leading-none uppercase tracking-tighter text-gold">ALFA HC</h1>
            <p class="text-[6px] uppercase tracking-[0.2em] text-slate-400 font-bold mt-1">SISTEMA DE GESTIÓN DE PEDIDOS</p>
        </div>
        <button onclick="goBack()" id="back-btn" class="hidden text-white text-[9px] font-bold uppercase border border-slate-700 px-3 py-1.5 rounded-lg bg-slate-800">Volver</button>
    </nav>

    <section id="view-hero" class="view-section view-active hero-gradient text-white items-center justify-between px-10 py-12 text-center">
        <div class="mt-4">
             <div class="inline-block border border-gold/40 bg-gold/10 rounded-full px-5 py-1.5">
                <span class="text-[9px] font-bold tracking-widest uppercase text-gold">Panel Oficial</span>
            </div>
        </div>
        <div class="w-full">
            <h2 class="text-xl font-extrabold mb-8 tracking-tight leading-[1.2] text-white/90">Distribución de Cigarrillos<br><span class="text-gold uppercase tracking-widest text-sm">BIGOTT</span></h2>
            
            <button onclick="enviarUbicacion()" class="bg-white/10 border border-white/20 text-white px-6 py-3 rounded-full font-bold text-[10px] mb-8 flex items-center gap-2 mx-auto">
                <i class="fas fa-map-marker-alt text-red-500"></i> MANDAR MI GPS ACTUAL
            </button>

            <button onclick="toggleView('order')" class="bg-gold text-black px-8 py-4 rounded-2xl font-black text-sm w-full max-w-[280px] mx-auto shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3">
                REALIZAR PEDIDO <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </section>

    <section id="view-order" class="view-section">
        <div class="bg-emerald-50 px-5 py-2 border-b border-emerald-100">
            <h3 class="text-[9px] font-black text-emerald-800 uppercase tracking-widest text-center">Catálogo de Productos</h3>
        </div>
        
        <div class="static-container">
            <div id="order-list"></div>
            
            <div class="mt-6 mb-12 p-5 bg-white rounded-2xl border-2 border-blue-100 shadow-sm">
                <h4 class="text-[11px] font-black text-blue-900 uppercase mb-3"><i class="fas fa-user-check"></i> Gestor de Clientes</h4>
                
                <select id="select-cliente" onchange="cargarCliente()" class="input-data border-blue-200 bg-blue-50">
                    <option value="">-- CLIENTES GUARDADOS --</option>
                </select>

                <div class="mt-4 pt-4 border-t border-dashed">
                    <input id="inp-cliente" type="text" placeholder="Nombre del Negocio" class="input-data">
                    <input id="inp-rif" type="text" placeholder="RIF / Cédula" class="input-data">
                    <input id="inp-direccion" type="text" placeholder="Dirección de Entrega" class="input-data">
                    
                    <button onclick="guardarClienteEnMemoria()" class="btn-save-client">
                        <i class="fas fa-save"></i> Guardar Cliente en el Teléfono
                    </button>
                </div>
            </div>
        </div>

        <footer class="catalog-footer">
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-white/60 text-[10px] font-bold uppercase">Monto Total:</span>
                <span id="grand-total" class="text-gold text-2xl font-black">$0.00</span>
            </div>
            <button onclick="sendWhatsAppOrder()" id="btn-final" class="btn-whatsapp-direct w-full">
                <i class="fab fa-whatsapp text-2xl"></i> <span>ENVIAR Y REGISTRAR</span>
            </button>
        </footer>
    </section>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymaqrxlIUCOdz51HPIkpjLRa-y3l8pViPEDsA0fWB7qVKI3OQQ1WcQA-u5vg972sI/exec";
        
        const products = [
            { name: 'BELMONT', price: 25.60, stock: true },
            { name: 'BELMONT MEDIA CAJA', price: 15.40, stock: true },
            { name: 'LUCKY NOVA', price: 30.60, stock: true },
            { name: 'LUCKY RED ORIGINAL', price: 28.00, stock: true },
            { name: 'PALL MALL', price: 25.60, stock: true },
            { name: 'VICEROY', price: 16.50, stock: true },
            { name: 'CONSUL', price: 14.00, stock: true },
            { name: 'LUCKY COSMIC', price: 30.60, stock: true },
            { name: 'ENCENDEDOR BIC', price: 1.50, stock: true }
        ];

        let cart = {};
        let dbClientes = JSON.parse(localStorage.getItem('alfa_db')) || {};

        function toggleView(view) {
            document.getElementById('view-hero').classList.toggle('view-active', view === 'hero');
            document.getElementById('view-order').classList.toggle('view-active', view === 'order');
            document.getElementById('back-btn').classList.toggle('hidden', view === 'hero');
            if(view === 'order') { renderOrderList(); actualizarListaClientes(); }
        }

        function goBack() { toggleView('hero'); }

        function renderOrderList() {
            const container = document.getElementById('order-list');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="flex flex-col"><span class="text-[10px] font-black uppercase text-slate-700">${p.name}</span><span class="text-[9px] font-bold text-slate-400">$${p.price.toFixed(2)}</span></div>
                    <div class="flex items-center gap-3"><button onclick="updateQty('${p.name}', -1)" class="qty-btn">-</button><span class="w-6 text-center font-black text-slate-800">${cart[p.name] || 0}</span><button onclick="updateQty('${p.name}', 1)" class="qty-btn text-slate-900">+</button></div>
                </div>
            `).join('');
            calculateTotal();
        }

        function updateQty(name, change) {
            cart[name] = Math.max(0, (cart[name] || 0) + change);
            renderOrderList();
        }

        function calculateTotal() {
            let total = 0;
            products.forEach(p => { if (cart[p.name]) total += p.price * cart[p.name]; });
            document.getElementById('grand-total').innerText = `$${total.toFixed(2)}`;
            return total;
        }

        function guardarClienteEnMemoria() {
            const nombre = document.getElementById('inp-cliente').value.trim().toUpperCase();
            const rif = document.getElementById('inp-rif').value.trim();
            const dir = document.getElementById('inp-direccion').value.trim();

            if(!nombre) return alert("Escribe al menos el nombre para guardar");

            dbClientes[nombre] = { rif, dir };
            localStorage.setItem('alfa_db', JSON.stringify(dbClientes));
            actualizarListaClientes();
            alert("✅ Cliente '" + nombre + "' guardado con éxito");
        }

        function actualizarListaClientes() {
            const select = document.getElementById('select-cliente');
            select.innerHTML = '<option value="">-- CLIENTES GUARDADOS --</option>';
            Object.keys(dbClientes).sort().forEach(n => {
                const opt = document.createElement('option');
                opt.value = n; opt.textContent = n;
                select.appendChild(opt);
            });
        }

        function cargarCliente() {
            const n = document.getElementById('select-cliente').value;
            if(n && dbClientes[n]) {
                document.getElementById('inp-cliente').value = n;
                document.getElementById('inp-rif').value = dbClientes[n].rif;
                document.getElementById('inp-direccion').value = dbClientes[n].dir;
            }
        }

        async function sendWhatsAppOrder() {
            const nom = document.getElementById('inp-cliente').value.trim();
            const rif = document.getElementById('inp-rif').value.trim();
            const dir = document.getElementById('inp-direccion').value.trim();
            const total = calculateTotal();

            if(!nom || total === 0 || !rif || !dir) {
                return alert("FALTAN DATOS: Asegúrate de tener productos, nombre, RIF y dirección.");
            }

            // AUTO-GUARDAR POR SI ACASO
            dbClientes[nom.toUpperCase()] = { rif, dir };
            localStorage.setItem('alfa_db', JSON.stringify(dbClientes));

            const btn = document.getElementById('btn-final');
            btn.disabled = true;
            btn.innerText = "REGISTRANDO EN EXCEL...";

            let items = products.filter(p => cart[p.name] > 0).map(p => `${cart[p.name]}x ${p.name}`).join(", ");

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST", mode: "no-cors",
                    body: JSON.stringify({ cliente: nom, rif: rif, direccion: dir, pedido: items, total: total })
                });

                let msg = `*ALFA HC - NUEVO PEDIDO*\n\n*CLIENTE:* ${nom}\n*RIF:* ${rif}\n*DIR:* ${dir}\n\n*PRODUCTOS:*\n${items.replace(/, /g, '\n')}\n\n💰 *TOTAL: $${total.toFixed(2)}*`;
                window.location.href = `https://wa.me/584124401702?text=${encodeURIComponent(msg)}`;

                // LIMPIEZA
                cart = {};
                document.getElementById('inp-cliente').value = "";
                document.getElementById('inp-rif').value = "";
                document.getElementById('inp-direccion').value = "";
                renderOrderList();

            } catch (e) {
                alert("Error de conexión");
            } finally { btn.disabled = false; btn.innerHTML = '<i class="fab fa-whatsapp"></i> <span>ENVIAR Y REGISTRAR</span>'; }
        }

        function enviarUbicacion() {
            navigator.geolocation.getCurrentPosition(p => {
                const link = `http://googleusercontent.com/maps.google.com/2{p.coords.latitude},${p.coords.longitude}`;
                window.location.href = `https://wa.me/584124401702?text=${encodeURIComponent("📍 *UBICACIÓN DE ENTREGA:* \n" + link)}`;
            }, () => alert("Activa el GPS"));
        }

        window.onload = () => toggleView('hero');
    </script>
</body>
</html>
