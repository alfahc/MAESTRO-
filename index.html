<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alfa HC | Catálogo Maestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root { --midnight: #121b2d; --gold: #f4b41a; --whatsapp: #25D366; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--midnight); height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; color: white; }
        .hero-gradient { background: radial-gradient(circle at center, #1e293b 0%, var(--midnight) 100%); }
        .sticky-nav { background: var(--midnight); border-bottom: 2px solid var(--gold); padding: 10px 20px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .view-section { display: none; flex: 1; height: 100%; overflow: hidden; }
        .view-active { display: flex; flex-direction: column; }
        .static-container { flex: 1; display: flex; flex-direction: column; background: #f8fafc; padding: 8px 12px; overflow-y: auto; }
        .product-card { background: white; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 6px; color: #334155; }
        .qty-btn { background: #f1f5f9; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid #e2e8f0; }
        .catalog-footer { background: var(--midnight); padding: 12px 20px; flex-shrink: 0; border-top: 1px solid #1e293b; }
        .btn-whatsapp-direct { background-color: var(--whatsapp); color: white; padding: 14px; border-radius: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: none; }
        .btn-location-hero { background: rgba(59, 130, 246, 0.1); color: #60a5fa; padding: 12px 24px; border-radius: 50px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 11px; text-transform: uppercase; border: 1px solid rgba(59, 130, 246, 0.3); margin-bottom: 10px; }
    </style>
</head>
<body>

    <nav class="sticky-nav">
        <div class="flex flex-col">
            <h1 class="text-lg font-black italic text-gold">ALFA HC</h1>
            <p class="text-[6px] uppercase tracking-[0.2em] text-slate-400 font-bold mt-1">RIF: J-411261297</p>
        </div>
        <button onclick="toggleView('hero')" id="back-btn" class="hidden text-white text-[9px] font-bold uppercase border border-slate-700 px-3 py-1.5 rounded-lg bg-slate-800">Volver</button>
    </nav>

    <section id="view-hero" class="view-section view-active hero-gradient text-white items-center justify-between px-10 py-12 text-center">
        <div class="mt-4"><div class="inline-block border border-gold/40 bg-gold/10 rounded-full px-5 py-1.5"><span class="text-[9px] font-bold tracking-widest uppercase text-gold">Catálogo Oficial</span></div></div>
        <div class="w-full flex flex-col items-center">
            <h2 class="text-xl font-extrabold mb-8 tracking-tight leading-[1.2]">Cigarrillos Nacionales<br><span class="text-gold uppercase tracking-widest text-sm">MARCA BIGOTT</span></h2>
            
            <button onclick="enviarUbicacion()" class="btn-location-hero">
                <i class="fas fa-map-marker-alt"></i> <span id="txt-loc">UBICACIÓN DE ENTREGA</span>
            </button>
            
            <p class="text-[8px] text-slate-400 mb-6 uppercase tracking-wider italic">* Recuerde activar su GPS primero</p>
            <button onclick="toggleView('order')" class="bg-gold text-black px-8 py-4 rounded-2xl font-black text-sm w-full max-w-[280px] shadow-xl">VER PRECIOS <i class="fas fa-chevron-right ml-2"></i></button>
        </div>
        <p class="text-slate-500 text-[8px] font-bold uppercase tracking-[0.3em]">Calidad • Servicio</p>
    </section>

    <section id="view-order" class="view-section">
        <div class="static-container" id="order-list"></div>
        <footer class="catalog-footer">
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-white/60 text-[10px] font-bold uppercase">TOTAL A PAGAR:</span>
                <span id="grand-total" class="text-gold text-2xl font-black">$0.00</span>
            </div>
            <button onclick="sendWhatsAppOrder()" class="btn-whatsapp-direct">
                <i class="fab fa-whatsapp text-2xl"></i> ENVIAR PEDIDO
            </button>
        </footer>
    </section>

    <script>
        const products = [
            { name: 'BELMONT', price: 25.60 }, { name: 'BELMONT MEDIA CAJA', price: 15.40 },
            { name: 'LUCKY NOVA', price: 30.60 }, { name: 'LUCKY RED ORIGINAL', price: 28.00 },
            { name: 'PALL MALL', price: 25.60 }, { name: 'VICEROY', price: 16.50 },
            { name: 'CONSUL', price: 14.00 }, { name: 'LUCKY COSMIC', price: 30.60 },
            { name: 'ENCENDEDOR BIC', price: 1.50 }
        ];

        let cart = {};

        function toggleView(view) {
            document.getElementById('view-hero').classList.toggle('view-active', view === 'hero');
            document.getElementById('view-order').classList.toggle('view-active', view === 'order');
            document.getElementById('back-btn').classList.toggle('hidden', view === 'hero');
            if(view === 'order') renderOrderList();
        }

        function renderOrderList() {
            const container = document.getElementById('order-list');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="flex flex-col flex-1">
                        <span class="text-[10px] font-black uppercase text-slate-700">${p.name}</span>
                        <span class="text-[9px] font-bold text-slate-400">$${p.price.toFixed(2)}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="updateQty('${p.name}', -1)" class="qty-btn text-slate-400">-</button>
                        <span class="w-6 text-center font-black text-slate-800">${cart[p.name] || 0}</span>
                        <button onclick="updateQty('${p.name}', 1)" class="qty-btn text-slate-900">+</button>
                    </div>
                </div>
            `).join('');
            calculateTotal();
        }

        function updateQty(name, change) {
            cart[name] = Math.max(0, (cart[name] || 0) + change);
            renderOrderList();
        }

        function calculateTotal() {
            let total = 0;
            products.forEach(p => { if (cart[p.name]) total += p.price * cart[p.name]; });
            document.getElementById('grand-total').innerText = `$${total.toFixed(2)}`;
        }

        function sendWhatsAppOrder() {
            let message = "📦 *NUEVO PEDIDO - ALFA HC*\n\n";
            let items = "";
            let total = 0;
            products.forEach(p => {
                if (cart[p.name] > 0) {
                    items += `▪️ ${cart[p.name]}x ${p.name}\n`;
                    total += p.price * cart[p.name];
                }
            });
            if (!items) return alert("Agregue productos primero.");
            message += items + `\n💰 *TOTAL: $${total.toFixed(2)}*`;
            
            window.location.href = `https://wa.me/584124401702?text=${encodeURIComponent(message)}`;
            
            setTimeout(() => {
                cart = {};
                renderOrderList();
                calculateTotal();
            }, 1000);
        }

        function enviarUbicacion() {
            const btnText = document.getElementById('txt-loc');
            btnText.innerText = "LOCALIZANDO...";
            
            // navigator.geolocation con alta precisión para tiempo real
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    // MENSAJE CON TEXTO SOLICITADO
                    const msg = `📍 *UBICACIÓN DE ENTREGA:* \n${mapLink}`;
                    window.location.href = `https://wa.me/584124401702?text=${encodeURIComponent(msg)}`;
                    btnText.innerText = "UBICACIÓN DE ENTREGA";
                },
                () => { 
                    alert("Active su GPS y permita el acceso para enviar la ubicación exacta."); 
                    btnText.innerText = "UBICACIÓN DE ENTREGA"; 
                },
                { 
                    enableHighAccuracy: true, // FORZA GPS REAL
                    timeout: 7000, 
                    maximumAge: 0 
                }
            );
        }
        window.onload = () => toggleView('hero');
    </script>
</body>
</html>
