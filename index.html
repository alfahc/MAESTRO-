<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alfa HC | Catálogo Maestro Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root { --midnight: #121b2d; --gold: #f4b41a; --whatsapp: #25D366; }
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: pan-y; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--midnight); height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; color: white; }
        .hero-gradient { background: radial-gradient(circle at center, #1e293b 0%, var(--midnight) 100%); }
        .sticky-nav { background: var(--midnight); border-bottom: 2px solid var(--gold); padding: 10px 20px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .view-section { display: none; flex: 1; height: 100%; overflow: hidden; }
        .view-active { display: flex; flex-direction: column; }
        .static-container { flex: 1; display: flex; flex-direction: column; background: #f8fafc; padding: 8px 12px; overflow-y: auto; }
        .product-card { background: white; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 6px; color: #334155; }
        .qty-btn { background: #f1f5f9; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid #e2e8f0; }
        .catalog-footer { background: var(--midnight); padding: 12px 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); flex-shrink: 0; border-top: 1px solid #1e293b; }
        .btn-whatsapp-direct { background-color: var(--whatsapp); color: white; padding: 14px; border-radius: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .btn-location-maps { background: linear-gradient(135deg, #4285F4 0%, #34A853 100%); color: white; padding: 12px 24px; border-radius: 50px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 11px; text-transform: uppercase; border: 2px solid rgba(255, 255, 255, 0.2); margin-bottom: 15px; box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3); }
        .input-data { width: 100%; padding: 10px; margin-top: 8px; border-radius: 10px; border: 1px solid #cbd5e1; color: #1e293b; font-size: 12px; font-weight: 600; }
        .search-container { position: relative; width: 100%; }
        #search-results { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 0 0 10px 10px; z-index: 100; max-height: 150px; overflow-y: auto; display: none; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .search-item { padding: 10px; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="sticky-nav">
        <div class="flex flex-col">
            <h1 class="text-lg font-black italic leading-none uppercase tracking-tighter text-gold">ALFA HC</h1>
            <p class="text-[6px] uppercase tracking-[0.2em] text-slate-400 font-bold mt-1">RIF: J-411261297</p>
        </div>
        <button onclick="goBack()" id="back-btn" class="hidden text-white text-[9px] font-bold uppercase border border-slate-700 px-3 py-1.5 rounded-lg bg-slate-800">Volver</button>
    </nav>

    <section id="view-hero" class="view-section view-active hero-gradient text-white items-center justify-between px-10 py-12 text-center">
        <div class="mt-4"><div class="inline-block border border-gold/40 bg-gold/10 rounded-full px-5 py-1.5"><span class="text-[9px] font-bold tracking-widest uppercase text-gold">Gestión de Ventas</span></div></div>
        <div class="w-full">
            <h2 class="text-xl font-extrabold mb-8 tracking-tight leading-[1.2] text-white/90">Distribución de Cigarrillos<br><span class="text-gold uppercase tracking-widest text-sm">MARCA BIGOTT</span></h2>
            <button onclick="enviarUbicacion()" class="btn-location-maps"><i class="fas fa-map-marker-alt"></i><span id="txt-loc">ENVIAR UBICACIÓN</span></button>
            <button onclick="goToOrder()" class="bg-[#f4b41a] text-black px-8 py-4 rounded-2xl font-black text-sm w-full max-w-[280px] mx-auto shadow-xl flex items-center justify-center gap-3">VER LISTA Y NOTA <i class="fas fa-chevron-right"></i></button>
        </div>
        <p class="text-slate-500 text-[8px] font-bold uppercase tracking-[0.3em]">Respaldo Profesional</p>
    </section>

    <section id="view-order" class="view-section">
        <div class="bg-emerald-50 px-5 py-2 border-b border-emerald-100 flex justify-between items-center">
            <h3 class="text-[9px] font-black text-emerald-800 uppercase tracking-widest">Pedido & Nota</h3>
        </div>
        <div class="static-container">
            <div id="order-list"></div>
            <div class="mt-4 p-4 bg-white rounded-xl border border-gold/30 shadow-sm mb-6">
                <h4 class="text-[10px] font-black text-slate-700 uppercase mb-2">Buscador de Clientes</h4>
                <div class="search-container">
                    <input id="search-input" type="text" placeholder="Escriba para buscar..." class="input-data bg-gold/5" oninput="filtrarClientes()">
                    <div id="search-results"></div>
                </div>
                <hr class="my-4">
                <input id="inp-cliente" type="text" placeholder="Nombre/Negocio" class="input-data">
                <input id="inp-rif" type="text" placeholder="RIF/Cédula" class="input-data">
                <input id="inp-direccion" type="text" placeholder="Dirección" class="input-data">
            </div>
        </div>
        <footer class="catalog-footer">
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-white/60 text-[10px] font-bold uppercase tracking-widest">TOTAL:</span>
                <span id="grand-total" class="text-gold text-2xl font-black">$0.00</span>
            </div>
            <button onclick="procesarVenta()" class="btn-whatsapp-direct w-full">
                <i class="fas fa-file-invoice-dollar text-xl"></i>
                <span>GENERAR NOTA Y ENVIAR</span>
            </button>
        </footer>
    </section>

    <script>
        const products = [
            { name: 'BELMONT', price: 25.60 }, { name: 'BELMONT MEDIA CAJA', price: 15.40 },
            { name: 'LUCKY NOVA', price: 30.60 }, { name: 'LUCKY RED ORIGINAL', price: 28.00 },
            { name: 'PALL MALL', price: 25.60 }, { name: 'VICEROY', price: 16.50 },
            { name: 'CONSUL', price: 14.00 }, { name: 'LUCKY COSMIC', price: 30.60 },
            { name: 'ENCENDEDOR BIC', price: 1.50 }
        ];
        let cart = {};

        function goToOrder() { window.history.pushState({view: 'order'}, ""); renderView('order'); }
        function goBack() { if(window.history.state?.view === 'order') window.history.back(); else renderView('hero'); }
        window.onpopstate = function() { renderView('hero'); };
        function renderView(view) {
            document.getElementById('view-hero').classList.toggle('view-active', view === 'hero');
            document.getElementById('view-order').classList.toggle('view-active', view === 'order');
            document.getElementById('back-btn').classList.toggle('hidden', view === 'hero');
            if(view === 'order') renderOrderList();
        }

        function renderOrderList() {
            const container = document.getElementById('order-list');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="flex flex-col flex-1"><span class="text-[10px] font-black uppercase text-slate-700">${p.name}</span><span class="text-[9px] font-bold text-slate-400">$${p.price.toFixed(2)}</span></div>
                    <div class="flex items-center gap-3"><button onclick="updateQty('${p.name}', -1)" class="qty-btn">-</button><span class="w-6 text-center font-black text-slate-800">${cart[p.name] || 0}</span><button onclick="updateQty('${p.name}', 1)" class="qty-btn">+</button></div>
                </div>`).join('');
            calculateTotal();
        }

        function updateQty(name, change) { cart[name] = Math.max(0, (cart[name] || 0) + change); renderOrderList(); }
        function calculateTotal() {
            let total = 0;
            products.forEach(p => { if (cart[p.name]) total += p.price * cart[p.name]; });
            document.getElementById('grand-total').innerText = `$${total.toFixed(2)}`;
            return total;
        }

        function filtrarClientes() {
            const input = document.getElementById('search-input').value.toUpperCase();
            const resultsDiv = document.getElementById('search-results');
            const db = JSON.parse(localStorage.getItem('alfa_clientes')) || {};
            if (input.length < 1) { resultsDiv.style.display = 'none'; return; }
            const coinciden = Object.keys(db).filter(n => n.includes(input));
            if (coinciden.length > 0) {
                resultsDiv.innerHTML = coinciden.map(n => `<div class="search-item" onclick="seleccionarCliente('${n}')">${n}</div>`).join('');
                resultsDiv.style.display = 'block';
            } else resultsDiv.style.display = 'none';
        }

        function seleccionarCliente(n) {
            const db = JSON.parse(localStorage.getItem('alfa_clientes')) || {};
            document.getElementById('inp-cliente').value = n;
            document.getElementById('inp-rif').value = db[n].rif || "";
            document.getElementById('inp-direccion').value = db[n].dir || "";
            document.getElementById('search-results').style.display = 'none';
        }

        // --- FUNCIÓN MAESTRA: GENERAR NOTA Y WHATSAPP ---
        function procesarVenta() {
            const nom = document.getElementById('inp-cliente').value.trim();
            const rif = document.getElementById('inp-rif').value.trim();
            const dir = document.getElementById('inp-direccion').value.trim();
            const total = calculateTotal();
            
            if (!nom || total === 0) return alert("Complete los datos del cliente y agregue productos.");

            // 1. Guardar cliente
            let db = JSON.parse(localStorage.getItem('alfa_clientes')) || {};
            db[nom.toUpperCase()] = { rif, dir };
            localStorage.setItem('alfa_clientes', JSON.stringify(db));

            // 2. Generar PDF Profesional
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Encabezado
            doc.setFillColor(18, 27, 45); // Midnight
            doc.rect(0, 0, 210, 40, 'F');
            doc.setTextColor(244, 180, 26); // Gold
            doc.setFontSize(22); doc.setFont("helvetica", "bold");
            doc.text("ALFA HC", 15, 20);
            doc.setFontSize(8); doc.setTextColor(255, 255, 255);
            doc.text("DISTRIBUIDORA DE CIGARRILLOS", 15, 26);
            doc.text("RIF: J-411261297 | VALENCIA, VENEZUELA", 15, 30);
            
            doc.setFontSize(14); doc.setTextColor(244, 180, 26);
            doc.text("NOTA DE ENTREGA", 140, 25);
            
            // Datos Cliente
            doc.setTextColor(0, 0, 0); doc.setFontSize(10);
            doc.text(`CLIENTE: ${nom.toUpperCase()}`, 15, 50);
            doc.text(`RIF/CI: ${rif}`, 15, 55);
            doc.text(`DIRECCIÓN: ${dir}`, 15, 60);
            doc.text(`FECHA: ${new Date().toLocaleDateString()}`, 140, 50);

            // Tabla de productos
            const rows = [];
            products.forEach(p => {
                if (cart[p.name] > 0) {
                    rows.push([cart[p.name], p.name, `$${p.price.toFixed(2)}`, `$${(cart[p.name] * p.price).toFixed(2)}`]);
                }
            });

            doc.autoTable({
                startY: 70, head: [['CANT', 'DESCRIPCIÓN', 'PRECIO U.', 'SUBTOTAL']],
                body: rows, headStyles: { fillColor: [18, 27, 45] },
                columnStyles: { 0: { halign: 'center' }, 3: { halign: 'right' } }
            });

            const finalY = doc.lastAutoTable.finalY + 10;
            doc.setFontSize(12); doc.setFont("helvetica", "bold");
            doc.text(`TOTAL A COBRAR: $${total.toFixed(2)}`, 140, finalY);

            // Firma
            doc.setFontSize(8);
            doc.text("__________________________", 15, finalY + 20);
            doc.text("RECIBIDO CONFORME (FIRMA/SELLO)", 15, finalY + 25);

            // Descargar PDF
            doc.save(`Nota_AlfaHC_${nom}.pdf`);

            // 3. Enviar WhatsApp
            let itemsText = "";
            products.forEach(p => { if (cart[p.name] > 0) itemsText += `• ${cart[p.name]}x ${p.name}\n`; });
            const msg = `*ALFA HC - NUEVO PEDIDO*\n\n✅ *Nota de Entrega Generada*\n*Cliente:* ${nom}\n*Total:* $${total.toFixed(2)}\n\n*Pedido:*\n${itemsText}`;
            window.location.href = `https://wa.me/584124401702?text=${encodeURIComponent(msg)}`;
            
            // Limpiar
            cart = {}; renderOrderList();
        }

        function enviarUbicacion() {
            navigator.geolocation.getCurrentPosition((pos) => {
                const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                window.location.href = `https://wa.me/584124401702?text=${encodeURIComponent('📍 Ubicación: ' + mapLink)}`;
            });
        }
        window.onload = () => renderView('hero');
    </script>
</body>
</html>
